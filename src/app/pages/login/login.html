<section class="pagina">
  <h1>Acceso de administrador</h1>

  @if (error()) {
    <p class="aviso error">{{ error() }}</p>
  }

  <form class="tarjeta formulario caja" #f="ngForm" (ngSubmit)="entrar()">
    <div class="campos">
      <label>Usuario
        <input name="usuario" [(ngModel)]="usuario" autocomplete="username" required />
      </label>
      <label>Contraseña
        <input name="clave" type="password" [(ngModel)]="clave" autocomplete="current-password" required />
      </label>
    </div>
    <div class="fila">
      <button type="submit" [disabled]="f.invalid || cargando()">Ingresar</button>
    </div>
  </form>
</section>
